# Used when running `streamlit run dashboard/main.py` from the project root.
# scripts/dashboard.py passes the same settings from app/config.py.
[server]
address = "localhost"
headless = true

[browser]
gatherUsageStats = false

[client]
# No "Deploy" button or developer menu: this is a local app with biometric data, never deployed to the cloud.
toolbarMode = "minimal"
